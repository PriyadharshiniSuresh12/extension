
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Web Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
        }

        nav {
            background-color: #444;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .hero {
            padding: 60px 20px;
            background-color: white;
        }

        .hero h1 {
            font-size: 40px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
        }

        button {
            padding: 12px 25px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .card {
            background-color: white;
            width: 250px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my forsedfjh   first webpage</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>

    <section class="hero">
        <h1>Hello, I'm Priya 👋</h1>

        <p>
            I am learning HTML, CSS, JavaScript and Web Automation.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>
    </section>

    <section class="cards">

        <div class="card">
            <h2>HTML</h2>
            <p>Learn how to create webpages using HTML.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Learn
